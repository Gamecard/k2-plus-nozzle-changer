#####################################################################
# Kopf-LEDs mit Bedeutung (Statusanzeige, Stand 11.11.2026) – ENTWURF, nicht am Drucker erprobt
# Kette kopf_leds: LED 1–6 Status-Leiste · 7–8 Farbe der aktiven Patrone · 9–10 Düsenlicht (weiß)
# Nur Upstream-Klipper (SET_LED, delayed_gcode), kein Zusatzmodul.
#
# Benutzung in anderen Makros:
#   _LED_STATUS ZUSTAND=wechsel        (am Anfang von P19_ABLEGEN / P19_AUFNEHMEN)
#   _LED_STATUS ZUSTAND=auto           (am Ende: Zustand wieder aus Druckerstatus ableiten)
#   _LED_STATUS ZUSTAND=antasten       (vor PRTouch/Cartographer), danach ZUSTAND=auto
#   _LED_STATUS ZUSTAND=fehler         (VOR action_emergency_stop in Wächter-Makros – LEDs behalten die Farbe)
#   _LED_PATRONE FARBE=FF8800          (Filamentfarbe der aktiven Patrone, z. B. aus dem Slicer/CFS)
#   _LED_DUESE HELL=1.0                (Düsenlicht 0…1, z. B. 1.0 für Kameraaufnahmen)
#####################################################################

[gcode_macro _LED_STATUS]
description: Status-Leiste setzen (bereit/aufheizen/druckt/wechsel/riegel_offen/filament_fehlt/antasten/pause/fehler/usb/auto)
variable_zustand: 'auto'
variable_takt: 0
gcode:
  {% set z = params.ZUSTAND|default('auto')|lower %}
  SET_GCODE_VARIABLE MACRO=_LED_STATUS VARIABLE=zustand VALUE="'{z}'"
  SET_GCODE_VARIABLE MACRO=_LED_STATUS VARIABLE=takt VALUE=0
  UPDATE_DELAYED_GCODE ID=_LED_TAKT DURATION=0.1

[gcode_macro _LED_LEISTE]
description: intern – Status-LEDs 1–6 in einer Farbe, optional nur die ersten N
gcode:
  {% set r = params.R|default(0)|float %}
  {% set g = params.G|default(0)|float %}
  {% set b = params.B|default(0)|float %}
  {% set n = params.N|default(6)|int %}
  {% for i in range(1, 7) %}
    {% if i <= n %}
      SET_LED LED=kopf_leds RED={r} GREEN={g} BLUE={b} INDEX={i} TRANSMIT=0
    {% else %}
      SET_LED LED=kopf_leds RED=0 GREEN=0 BLUE=0 INDEX={i} TRANSMIT=0
    {% endif %}
  {% endfor %}
  SET_LED LED=kopf_leds RED={r if n >= 6 else 0} GREEN={g if n >= 6 else 0} BLUE={b if n >= 6 else 0} INDEX=6 TRANSMIT=1

[delayed_gcode _LED_TAKT]
initial_duration: 2
gcode:
  {% set v = printer["gcode_macro _LED_STATUS"] %}
  {% set z = v.zustand %}
  {% set t = v.takt|int %}
  {% set an = (t % 2) == 0 %}
  # --- Zustand automatisch ableiten ---
  {% if z == 'auto' %}
    {% set ps = printer.print_stats.state %}
    {% set ext = printer[printer.toolhead.extruder] %}
    {% if ps == 'printing' %}{% set z = 'druckt' %}
    {% elif ps == 'paused' %}{% set z = 'pause' %}
    {% elif ext.target > 0 and ext.temperature < ext.target - 3 %}{% set z = 'aufheizen' %}
    {% else %}{% set z = 'bereit' %}{% endif %}
  {% endif %}
  # --- anzeigen ---
  {% if z == 'bereit' %}
    _LED_LEISTE R=0.08 G=0.08 B=0.08
  {% elif z == 'druckt' %}
    _LED_LEISTE R=0 G=0.6 B=0
  {% elif z == 'pause' %}
    _LED_LEISTE R=0 G=0 B=0.6
  {% elif z == 'aufheizen' %}
    # Balken füllt sich mit dem Fortschritt (Ist/Soll), Farbe blau → rot
    {% set ext = printer[printer.toolhead.extruder] %}
    {% set anteil = ([ext.temperature / ext.target, 1.0]|min) if ext.target > 0 else 0 %}
    _LED_LEISTE R={anteil} G=0 B={1 - anteil} N={(anteil * 6)|round(0, 'ceil')|int}
  {% elif z == 'wechsel' %}
    # gelbes Lauflicht
    {% for i in range(1, 7) %}
      {% set hell = 0.8 if i == (t % 6) + 1 else 0.05 %}
      SET_LED LED=kopf_leds RED={hell} GREEN={hell * 0.7} BLUE=0 INDEX={i} TRANSMIT={1 if i == 6 else 0}
    {% endfor %}
  {% elif z == 'riegel_offen' %}
    _LED_LEISTE R={0.7 if (t % 4) < 2 else 0} G={0.5 if (t % 4) < 2 else 0} B=0
  {% elif z == 'filament_fehlt' %}
    _LED_LEISTE R={0.9 if an else 0} G={0.35 if an else 0} B=0
  {% elif z == 'antasten' %}
    {% set p = [0.15, 0.4, 0.7, 0.4][t % 4] %}
    _LED_LEISTE R={p} G=0 B={p}
  {% elif z == 'fehler' %}
    _LED_LEISTE R={1.0 if an else 0} G=0 B=0
  {% elif z == 'usb' %}
    _LED_LEISTE R={0.6 if an else 0} G={0.6 if an else 0} B={0.6 if an else 0}
  {% elif z == 'verriegelt' %}
    _LED_LEISTE R=0 G={0.8 if an else 0} B=0
    {% if t >= 5 %}SET_GCODE_VARIABLE MACRO=_LED_STATUS VARIABLE=zustand VALUE="'auto'"{% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_LED_STATUS VARIABLE=takt VALUE={t + 1}
  # schnelle Animationen 0,25 s, sonst 1 s
  UPDATE_DELAYED_GCODE ID=_LED_TAKT DURATION={0.25 if z in ['wechsel', 'fehler', 'filament_fehlt', 'antasten', 'verriegelt', 'usb'] else 1.0}

[gcode_macro _LED_EREIGNIS]
description: kurzes Ereignis (z. B. ART=verriegelt: 3 × grün blinken)
gcode:
  _LED_STATUS ZUSTAND={params.ART|default('auto')}

[gcode_macro _LED_PATRONE]
description: Farbe der aktiven Patrone (LED 7–8), FARBE=RRGGBB
gcode:
  {% set f = params.FARBE|default('FFFFFF') %}
  {% set r = (f[0:2]|int(base=16)) / 255.0 * 0.6 %}
  {% set g = (f[2:4]|int(base=16)) / 255.0 * 0.6 %}
  {% set b = (f[4:6]|int(base=16)) / 255.0 * 0.6 %}
  SET_LED LED=kopf_leds RED={r} GREEN={g} BLUE={b} INDEX=7 TRANSMIT=0
  SET_LED LED=kopf_leds RED={r} GREEN={g} BLUE={b} INDEX=8 TRANSMIT=1

[gcode_macro _LED_DUESE]
description: Düsenlicht weiß (LED 9–10), HELL=0…1
gcode:
  {% set h = params.HELL|default(0.6)|float %}
  SET_LED LED=kopf_leds RED={h} GREEN={h} BLUE={h} INDEX=9 TRANSMIT=0
  SET_LED LED=kopf_leds RED={h} GREEN={h} BLUE={h} INDEX=10 TRANSMIT=1
