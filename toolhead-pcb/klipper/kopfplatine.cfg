#####################################################################
# Kopfplatine P19 – Klipper-ENTWURF (11.11.2026)
# NICHT am Drucker erprobt. Pins = SCHALTUNG.md.
# Verbindung: CAN (Hauptweg). Firmware: STM32G0B1, 8 MHz Quarz, „CAN bus (on PB0/PB1)“, 1 Mbit/s, Katapult 8 KiB.
# Alternativ USB (Hub im Kopfkabel oder USB-C) → dann `serial:` statt `canbus_uuid:`.
#####################################################################

[mcu kopf]
canbus_uuid: <per ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0>
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_<ID>-if00

# --- Förderer (Extruder-Motor LDO-36STH20, TMC5160 mit externen MOSFETs) ---
# Heizung/Fühler je Patrone stehen in heizplatine.cfg (extruder … extruder3 teilen sich diesen Förderer).
[extruder_stepper foerderer]
extruder: extruder
step_pin: kopf:PB10
dir_pin: kopf:PB11
enable_pin: !kopf:PB2
microsteps: 16
rotation_distance: 6.9            # Stock-K2-Wert, am Muster mit 100-mm-Test einmessen
gear_ratio: 48:6                  # Stufe 6/48 (E4) – prüfen, ob rotation_distance das schon enthält

[tmc5160 extruder_stepper foerderer]
cs_pin: kopf:PA4
spi_bus: spi1                     # PA5/PA6/PA7 – Busname für STM32G0 in Klipper prüfen
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999
diag0_pin: ^!kopf:PB14

# --- Beschleunigungssensor (G9) ---
[lis2dw]
cs_pin: kopf:PB13
spi_bus: spi1
axes_map: x, z, y                 # Platine steht senkrecht in der X-Z-Ebene – am Muster mit ACCELEROMETER_QUERY prüfen

[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20

# --- PRTouch-Messplatte über ADS1220 (G13, E6) ---
[load_cell_probe]
sensor_type: ads1220
cs_pin: kopf:PB12
spi_bus: spi1
data_ready_pin: kopf:PC2
gain: 128
sample_rate: 2000
counts_per_gram: <einmessen mit LOAD_CELL_CALIBRATE>
#trigger_force: 75               # Gramm – am Muster einstellen (Messplatte sieht nur 46/70 % der Kraft, AUSLEGUNG 11)

# --- Kopflüfter (2 × 1510) und Bauteillüfter, je mit Drehzahl (G10) ---
# Stecker ab F8-S6b: Kopflüfter L an J25 3–5, Kopflüfter R an J26 4–6, Bauteillüfter an J25 6–8 (SCHALTUNG.md 0f)
[heater_fan kopfluefter_l]
pin: kopf:PC6
tachometer_pin: ^kopf:PD8
heater: extruder, extruder1, extruder2, extruder3
heater_temp: 50.0

[heater_fan kopfluefter_r]
pin: kopf:PC7
tachometer_pin: ^kopf:PD9
heater: extruder, extruder1, extruder2, extruder3
heater_temp: 50.0

[fan]
pin: kopf:PC8
tachometer_pin: ^kopf:PC9

# --- Riegel (B2, G1) ---
[output_pin riegel_magnet]
pin: kopf:PB3
maximum_mcu_duration: 0.5          # 10 % ED: nie länger als 0,5 s bestromt
value: 0
shutdown_value: 0

[gcode_button riegel]
pin: ^kopf:PC0                     # G1 DRV5032 – Polarität am Muster prüfen
press_gcode:
  _LED_EREIGNIS ART=verriegelt
release_gcode:

# --- Arm-Sensor (G2): Ja/Nein über Komparator, ersetzt den K2-Kopf-Filamentsensor ---
[filament_switch_sensor filament_sensor]
switch_pin: kopf:PC1
pause_on_runout: True
runout_gcode:
  _LED_STATUS ZUSTAND=filament_fehlt
insert_gcode:
  _LED_STATUS ZUSTAND=auto

# --- Eddy-Spule (G3/D4) – in eigener Datei lassen, damit alles auch ohne läuft ---
#[ldc1612]
#i2c_mcu: kopf
#i2c_bus: i2c1_PB8_PB9            # Busname prüfen
#intb_pin: kopf:PC13

# --- Linienlaser (G7) ---
[output_pin kopf_laser]
pin: kopf:PB4
value: 0

# --- Platinentemperatur (F4: Kopf ≤ 75 °C) ---
[temperature_sensor kopfplatine]
sensor_type: Generic 3950
sensor_pin: kopf:PA1
pullup_resistor: 5100
min_temp: -10
max_temp: 80                       # STM32G0B1RBT6 ist nur bis 85 °C spezifiziert (125-°C-Variante bei JLC nicht lieferbar) → ab 80 °C Shutdown

# --- RGB-LEDs: 6 Status + 2 Patronenfarbe + 2 Düsenlicht (Reihenfolge der Kette im CAD festlegen) ---
[neopixel kopf_leds]
pin: kopf:PB5
chain_count: 10
color_order: GRB
initial_RED: 0.05
initial_GREEN: 0.05
initial_BLUE: 0.05

[include kopf_leds.cfg]
